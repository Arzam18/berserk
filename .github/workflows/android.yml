name: Berserk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Build
        run: |
          cd src
          make build \
              CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang \
              ARCH=armv8 \
              CFLAGS="-std=gnu11 -Wall -Wextra -Wshadow -g -O3 -DVERSION=\\\"20260524\\\" -DEVALFILE=\\\"berserk-9b84c340af7e.nn\\\" -DNDEBUG --target=aarch64-linux-android28 -march=armv8-a+simd -static-libstdc++ -pthread"

      - name: List build output
        run: |
          find src -maxdepth 1 -type f -executable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: berserk-android-arm64
          path: src/berserk

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Berserk Build ${{ github.run_number }}
          prerelease: true
          files: src/berserk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
